<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packs · DLS</title>
<meta name="theme-color" content="#04080f">

<link rel="stylesheet" href="assets/shell.css">
<style>
:root { color-scheme: dark; --accent: var(--dls-magenta); }

.stack { display: grid; gap: 16px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.duo > * { min-width: 0; }

.card { padding: 18px 20px; background: color-mix(in srgb, var(--accent) 46%, var(--dls-edge-soft)); }
.card__lab {
  font-family: var(--dls-mono);
  font-size: 9.5px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.card__big {
  margin-top: 8px;
  font-size: 30px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -.5px;
  color: var(--dls-magenta);
  text-shadow: 0 0 22px rgba(244, 114, 182, .3);
  font-variant-numeric: tabular-nums;
}
.card__big small { font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--dls-ink-dim); }
.card__sub { margin-top: 9px; font-size: 12.5px; line-height: 1.5; color: var(--dls-ink-dim); }

/* --- Table --------------------------------------------------------------- */

.tbl-scroll { overflow-x: auto; }
table { width: 100%; min-width: 700px; border-collapse: collapse; }
th {
  padding: 9px 10px;
  border-bottom: 1px solid var(--dls-edge);
  font-family: var(--dls-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
  text-align: right;
  white-space: nowrap;
}
th:first-child, td:first-child { text-align: left; }
td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--dls-edge-soft);
  text-align: right;
  font-variant-numeric: tabular-nums;
  vertical-align: top;
  white-space: nowrap;
}
tbody tr:hover td { background: rgba(244, 114, 182, .04); }

.name { font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: #eef6ff; }
.where {
  display: block;
  margin-top: 3px;
  font-family: var(--dls-mono);
  font-size: 8.5px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.badge {
  display: inline-block;
  margin-left: 7px;
  padding: 2px 7px;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
  background: rgba(244, 114, 182, .16);
  color: var(--dls-magenta);
  font-family: var(--dls-mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}
.price { font-weight: 900; font-size: 15px; color: #eef6ff; }

.contents { text-align: left; white-space: normal; min-width: 260px; }
.contents div { font-size: 12.5px; line-height: 1.5; color: var(--dls-ink-dim); }
.contents b { color: var(--dls-ink); font-weight: 700; }
.contents u {
  text-decoration: none;
  border-bottom: 1px dashed var(--dls-amber);
  color: var(--dls-amber);
  cursor: help;
}
.contents s { color: var(--dls-ink-faint); text-decoration: none; }

.worth { font-weight: 900; font-size: 15px; color: var(--dls-ink); }
.worth small { display: block; font-size: 10.5px; font-weight: 600; color: var(--dls-ink-faint); }
.verdict { font-weight: 900; font-size: 15px; }
.verdict small {
  display: block;
  font-family: var(--dls-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.good { color: var(--dls-mint); }
.bad { color: var(--dls-magenta); }
.unk { color: var(--dls-ink-faint); font-weight: 700; font-size: 13px; }

/* --- Prose blocks -------------------------------------------------------- */

.block { padding: 16px 18px; }
.block h2 {
  margin: 0 0 10px;
  font-family: var(--dls-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.8px;
  text-transform: uppercase;
}
.block--how h2 { color: var(--dls-cyan); }
.block--gaps h2 { color: var(--dls-magenta); }
.block ul { margin: 0; padding-left: 18px; }
.block li { margin-bottom: 9px; font-size: 12.5px; line-height: 1.55; color: var(--dls-ink-dim); }
.block li:last-child { margin-bottom: 0; }
.block li b { color: #eef6ff; font-weight: 700; }

@media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }
</style>
</head>

<body data-dls-page="packs" data-dls-skin="hud">

<div class="wrap stack">

  <header class="head">
    <p class="eyebrow">// Packs</p>
    <h1>Packs</h1>
    <p class="rule" id="head-rule">—</p>
  </header>

  <div class="duo">
    <div class="dls-panel card">
      <div class="card__lab">Best value pack</div>
      <div class="card__big" id="top">—</div>
      <div class="card__sub" id="top-sub"></div>
    </div>
    <div class="dls-panel card">
      <div class="card__lab">Worst value pack</div>
      <div class="card__big" id="bottom">—</div>
      <div class="card__sub" id="bottom-sub"></div>
    </div>
  </div>

  <div class="dls-panel">
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>Pack</th><th>Price</th><th>What is in it</th>
          <th>Worth to you</th><th>Verdict</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="duo">
    <div class="dls-panel block block--how">
      <h2>How a pack is scored</h2>
      <ul id="how"></ul>
    </div>
    <div class="dls-panel block block--gaps">
      <h2>Check these before trusting a row</h2>
      <ul id="gaps"></ul>
    </div>
  </div>

  <p class="note" id="foot"></p>

</div>

<script src="data/packs.js"></script>
<script src="data/coaches.js"></script>
<script src="data/store.js"></script>
<script src="assets/shell.js" defer></script>
<script>
/* A pack is scored against what its contents would cost you to buy one by one
   at your own prices. Nothing here is typed: coach prices resolve through
   data/coaches.js with your Training Centre discount, gems and coins through
   the best tier in data/store.js. Change a price in one of those files and
   every verdict on this page moves with it. */

var money = function (n) { return 'C$' + n.toFixed(2); };
var num = function (n) { return n.toLocaleString('en-CA'); };

function coachPrice(base) {
  return base == null ? null : Math.floor(base * (100 - COACH_DISCOUNT_PCT) / 100);
}

var GEM_RATE = Math.max.apply(null, GEM_PACKS.map(function (p) { return p.gems / p.price; }));
var COIN_RATE = Math.max.apply(null, COIN_PACKS.map(function (p) { return (p.base + p.bonus) / p.price; }));

/* Every item resolves to a CAD figure or to null. One null anywhere and the
   whole pack goes unscored — a partial total would read as a verdict while
   quietly leaving out the expensive half. */
function priceItem(it) {
  if (it.kind === 'gems') return { cad: it.n / GEM_RATE, label: num(it.n) + ' gems' };
  if (it.kind === 'coins') return { cad: it.n / COIN_RATE, label: num(it.n) + ' coins' };
  if (it.kind === 'dp') {
    return { cad: (it.n / DP_PER_GEM) / GEM_RATE, label: num(it.n) + ' Dream Points' };
  }
  if (it.kind === 'coach') {
    var c = COACHES.find(function (x) { return x.type === it.type && x.rarity === it.rarity; });
    var gems = c ? coachPrice(c.base) : null;
    return {
      cad: gems == null ? null : it.n * gems / GEM_RATE,
      label: it.n + ' × ' + it.rarity + ' ' + it.type + ' coach',
      each: gems
    };
  }
  var p = ITEM_PRICES[it.key] || {};
  return {
    cad: p.gems == null ? null : it.n * p.gems / GEM_RATE,
    label: it.n + ' × ' + it.key,
    each: p.gems,
    why: p.note
  };
}

function scorePack(pk) {
  if (pk.unscored) return { unscored: pk.unscored };
  var parts = pk.items.map(priceItem);
  var missing = parts.filter(function (p) { return p.cad == null; });
  var cad = missing.length ? null : parts.reduce(function (a, p) { return a + p.cad; }, 0);
  return {
    parts: parts,
    missing: missing,
    cad: cad,
    ratio: cad == null ? null : cad / pk.price,
    unsure: pk.items.some(function (i) { return i.sure === false; })
  };
}

(function () {
  var scored = PACKS.map(function (pk) { return { pk: pk, s: scorePack(pk) }; });

  document.getElementById('head-rule').textContent =
    'Prices in ' + PACK_CURRENCY + ' · read off the store ' + PACK_CHECKED
    + ' · scored against your own gem, coin and coach prices';

  /* --- rows --- */
  document.getElementById('rows').innerHTML = scored.map(function (r) {
    var pk = r.pk, s = r.s;

    var contents = s.unscored
      ? '<div>' + pk.unscored + '</div>'
      : s.parts.map(function (p, i) {
          var it = pk.items[i];
          var text = it.sure === false
            ? '<u title="Rarity read off an icon colour — worth confirming in game">' + p.label + '</u>'
            : '<b>' + p.label + '</b>';
          var each = p.each != null ? ' <s>· ' + p.each + ' gems each</s>'
                   : p.cad != null ? ''
                   : ' <s>· price unknown</s>';
          return '<div>' + text + each + '</div>';
        }).join('');

    var worth = s.unscored ? '<span class="unk">—</span>'
      : s.cad == null ? '<span class="unk">can’t price</span>'
      : '<span class="worth">' + money(s.cad) + '<small>' + Math.round(s.ratio * 100) + '% of price</small></span>';

    var verdict;
    if (s.unscored || s.cad == null) {
      verdict = '<span class="unk">—</span>';
    } else {
      var diff = s.cad - pk.price;
      var cls = diff >= 0 ? 'good' : 'bad';
      verdict = '<span class="verdict ' + cls + '">' + (diff >= 0 ? '+' : '−') + money(Math.abs(diff)).slice(2)
        + '<small>' + (diff >= 0 ? 'better than buying parts' : 'worse than buying parts') + '</small></span>';
    }

    return '<tr>'
      + '<td><span class="name">' + pk.name + '</span>'
      + (pk.badge ? '<span class="badge">' + pk.badge + '</span>' : '')
      + '<span class="where">' + pk.where + ' tab</span></td>'
      + '<td><span class="price">' + money(pk.price) + '</span>'
      + (pk.alsoGems ? '<span class="where">or ' + pk.alsoGems + ' gems</span>' : '') + '</td>'
      + '<td class="contents">' + contents + '</td>'
      + '<td>' + worth + '</td>'
      + '<td>' + verdict + '</td>'
      + '</tr>';
  }).join('');

  /* --- headline cards --- */
  var ranked = scored.filter(function (r) { return r.s.ratio != null; })
                     .sort(function (a, b) { return b.s.ratio - a.s.ratio; });

  function fill(id, r) {
    if (!r) return;
    document.getElementById(id).innerHTML =
      Math.round(r.s.ratio * 100) + '%<small> of what you pay</small>';
    document.getElementById(id + '-sub').textContent =
      r.pk.name + ' ' + money(r.pk.price) + ' — contents would cost you ' + money(r.s.cad)
      + ' bought separately' + (r.s.unsure ? '. Contents not fully confirmed.' : '.');
  }
  fill('top', ranked[0]);
  fill('bottom', ranked[ranked.length - 1]);

  /* --- how it is scored --- */
  document.getElementById('how').innerHTML = [
    'A pack is worth what its contents would cost <b>you</b> to buy one at a time. Gems and coins '
      + 'convert at the best tier in the store (' + GEM_RATE.toFixed(1) + ' gems and '
      + num(Math.round(COIN_RATE)) + ' coins per C$1); coaches use your discounted price.',
    'That makes pack value <b>account-specific and self-defeating</b>: the better your Training Centre '
      + 'gets, the cheaper coaches become on their own, and the worse every coach pack scores.',
    'A pack with <b>any unpriced item is left unscored</b> rather than partly scored. A partial total '
      + 'looks like a verdict while silently omitting whatever is missing.',
    'Dream Points are pinned by the store selling 5,000 of them for either C$9.99 or 500 gems, '
      + 'which fixes the rate at ' + DP_PER_GEM + ' points per gem.',
    'Value here ignores <b>whether you want the contents</b>. A pack of coaches you have no use for '
      + 'is a bad buy at any ratio.'
  ].map(function (l) { return '<li>' + l + '</li>'; }).join('');

  /* --- what to check --- */
  var unsurePacks = scored.filter(function (r) { return r.s.unsure; }).length;
  var unpriced = Object.keys(ITEM_PRICES).filter(function (k) { return ITEM_PRICES[k].gems == null; });

  document.getElementById('gaps').innerHTML = [
    '<b>Contents are read off icon colours</b>, and colour is what encodes rarity — silver Common, '
      + 'blue Rare, gold Legendary. ' + unsurePacks + ' of ' + PACKS.length + ' packs have at least one '
      + 'item whose rarity I inferred rather than read. Those are underlined in the table. '
      + 'Tapping the ⓘ on a pack in game gives the exact list.',
    '<b>' + unpriced.length + ' item prices are missing</b>: ' + unpriced.join(', ')
      + '. Every pack containing one of them is unscored.',
    '<b>Legendary Agent is guessed at 356 gems</b> and does not reconcile — agents get 5% off, so 356 '
      + 'implies a base near 375 rather than the 480 you estimated. Two packs lean on it.',
    'Champions Arena is not scored at all: it changes stadium income, so its payback is measured in '
      + 'matches played, not in gems.'
  ].map(function (l) { return '<li>' + l + '</li>'; }).join('');

  document.getElementById('foot').innerHTML =
    'Verdicts compare a pack against buying the same things yourself at your own prices — not against '
    + 'the store’s own “3× value” badges, which are measured against something the store does not explain.';
})();
</script>
</body>
</html>
