<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prize Ladder · DLS</title>
<meta name="theme-color" content="#04080f">

<link rel="stylesheet" href="assets/shell.css">
<style>
:root { color-scheme: dark; --accent: var(--dls-blue); }

.stack { display: grid; gap: 16px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.duo > * { min-width: 0; }

.card { padding: 18px 20px; background: color-mix(in srgb, var(--accent) 46%, var(--dls-edge-soft)); }
.card__lab {
  font-family: var(--dls-mono);
  font-size: 9.5px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.card__big {
  margin-top: 8px;
  font-size: 34px;
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -1px;
  color: var(--dls-blue);
  text-shadow: 0 0 22px rgba(59, 157, 255, .35);
  font-variant-numeric: tabular-nums;
}
.card__big small { font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--dls-ink-dim); }
.card__sub { margin-top: 9px; font-size: 12.5px; line-height: 1.5; color: var(--dls-ink-dim); }

/* --- Route comparison ---------------------------------------------------- */

.routes { display: grid; gap: 1px; background: var(--dls-edge-soft); }
.route {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 14px;
  align-items: baseline;
  padding: 11px 16px;
  background: var(--dls-panel);
}
.route b { font-size: 13px; font-weight: 700; color: var(--dls-ink); }
.route span { font-family: var(--dls-mono); font-size: 11px; color: var(--dls-ink-faint); white-space: nowrap; }
.route em {
  font-style: normal;
  font-size: 16px;
  font-weight: 900;
  color: var(--dls-blue);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.route--best { background: rgba(52, 211, 153, .08); }
.route--best em { color: var(--dls-mint); }
.route--free { background: rgba(59, 157, 255, .07); }

/* --- Planner ------------------------------------------------------------- */

.plan { padding: 16px 18px; }
.plan__lab {
  font-family: var(--dls-mono);
  font-size: 9.5px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.plan__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.plan input {
  width: 108px;
  padding: 9px 12px;
  clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  border: none;
  background: var(--dls-panel-lit);
  box-shadow: inset 0 0 0 1px var(--dls-edge);
  color: var(--dls-ink);
  font-family: var(--dls-mono);
  font-size: 15px;
  font-weight: 700;
}
.plan input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--dls-blue); }
.plan__unit { font-family: var(--dls-mono); font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dls-ink-faint); }
.plan__out { margin-top: 14px; font-size: 13.5px; line-height: 1.65; color: var(--dls-ink-dim); }
.plan__out b { color: #eef6ff; font-weight: 800; }
.plan__out em { font-style: normal; font-weight: 800; }
.plan__out .ok { color: var(--dls-mint); }
.plan__out .no { color: var(--dls-magenta); }

/* --- Ladder table -------------------------------------------------------- */

.tbl-scroll { overflow-x: auto; max-height: 620px; overflow-y: auto; }
table { width: 100%; min-width: 430px; border-collapse: collapse; }
th {
  position: sticky;
  top: 0;
  padding: 9px 12px;
  background: var(--dls-panel);
  border-bottom: 1px solid var(--dls-edge);
  font-family: var(--dls-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
  text-align: right;
  white-space: nowrap;
}
th:nth-child(2) { text-align: left; }
td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--dls-edge-soft);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
td:nth-child(2) { text-align: left; }
tbody tr:hover td { background: rgba(59, 157, 255, .05); }

.dp { font-weight: 800; color: var(--dls-ink); }
.dp--none { color: var(--dls-ink-faint); font-weight: 600; }
.rw { color: var(--dls-ink-dim); font-size: 12.5px; }
.pct { font-family: var(--dls-mono); font-size: 10px; color: var(--dls-ink-faint); }

tr.is-player td { background: rgba(59, 157, 255, .1); }
tr.is-player .rw { color: #eef6ff; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
tr.is-player .dp { color: var(--dls-blue); }
tr.is-gems .rw { color: var(--dls-cyan); }
tr.is-dpboost .rw { color: var(--dls-mint); }

/* --- Prose --------------------------------------------------------------- */

.block { padding: 16px 18px; }
.block h2 {
  margin: 0 0 10px;
  font-family: var(--dls-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.8px;
  text-transform: uppercase;
}
.block--how h2 { color: var(--dls-cyan); }
.block--gaps h2 { color: var(--dls-magenta); }
.block ul { margin: 0; padding-left: 18px; }
.block li { margin-bottom: 9px; font-size: 12.5px; line-height: 1.55; color: var(--dls-ink-dim); }
.block li:last-child { margin-bottom: 0; }
.block li b { color: #eef6ff; font-weight: 700; }
.block li em {
  display: block;
  margin-top: 3px;
  font-style: normal;
  font-family: var(--dls-mono);
  font-size: 9px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}

@media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }
</style>
</head>

<body data-dls-page="ladder" data-dls-skin="hud">

<div class="wrap stack">

  <header class="head">
    <p class="eyebrow">// Prize Ladder</p>
    <h1>Dream <em>Points</em></h1>
    <p class="rule" id="head-rule">—</p>
  </header>

  <div class="duo">
    <div class="dls-panel card">
      <div class="card__lab">Finish the ladder</div>
      <div class="card__big" id="target">—</div>
      <div class="card__sub" id="target-sub"></div>
    </div>
    <div class="dls-panel card">
      <div class="card__lab">What the ladder pays out</div>
      <div class="card__big" id="payout">—</div>
      <div class="card__sub" id="payout-sub"></div>
    </div>
  </div>

  <div class="dls-panel">
    <div class="routes" id="routes"></div>
  </div>

  <div class="dls-panel plan">
    <div class="plan__lab">Can I finish it?</div>
    <div class="plan__row">
      <span class="plan__unit">I have</span>
      <input id="have-dp" type="number" min="0" step="500" value="0" inputmode="numeric">
      <span class="plan__unit">DP · spending</span>
      <input id="spend-coins" type="number" min="0" step="1000" value="108687" inputmode="numeric">
      <span class="plan__unit">coins · winning</span>
      <input id="wins" type="number" min="0" step="1" value="6" inputmode="numeric">
      <span class="plan__unit">matches a day</span>
    </div>
    <div class="plan__out" id="plan-out"></div>
  </div>

  <div class="dls-panel">
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>Points</th><th>Reward</th><th>Of the way</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="duo">
    <div class="dls-panel block block--how">
      <h2>How it works</h2>
      <ul id="how"></ul>
    </div>
    <div class="dls-panel block block--gaps">
      <h2>Not solid yet</h2>
      <ul id="gaps"></ul>
    </div>
  </div>

  <p class="note" id="foot"></p>

</div>

<script src="data/ladder.js"></script>
<script src="data/store.js"></script>
<script src="assets/shell.js" defer></script>
<script>
/* The whole page hangs off two numbers: what a Dream Point costs by each
   route, and how many of them the ladder wants. Both are derived — the DP
   offers in data/ladder.js are priced through the best gem and coin tiers in
   data/store.js, so a store re-pricing moves every verdict here too. */

var money = function (n) { return 'C$' + n.toFixed(2); };
var num = function (n) { return Math.round(n).toLocaleString('en-CA'); };

var GEM_RATE = Math.max.apply(null, GEM_PACKS.map(function (p) { return p.gems / p.price; }));
var COIN_RATE = Math.max.apply(null, COIN_PACKS.map(function (p) { return (p.base + p.bonus) / p.price; }));

var COINS_PER_DP = DP_OFFERS.find(function (o) { return o.currency === 'coins'; });
COINS_PER_DP = COINS_PER_DP.cost / COINS_PER_DP.dp;

function offerCad(o) {
  return o.currency === 'cad' ? o.cost
       : o.currency === 'gems' ? o.cost / GEM_RATE
       : o.cost / COIN_RATE;
}

(function () {
  var perWin = DP_PER_WIN + DP_PER_AD;

  document.getElementById('head-rule').textContent =
    LADDER_EVENT + ' · ' + LADDER.length + ' rewards over ' + LADDER_DAYS + ' days';

  /* --- headline cards --- */
  document.getElementById('target').innerHTML =
    num(LADDER_TARGET) + '<small> DP</small>';
  document.getElementById('target-sub').textContent =
    'That is ' + num(LADDER_TARGET / perWin) + ' wins with an ad after each ('
    + (LADDER_TARGET / perWin / LADDER_DAYS).toFixed(1) + ' a day for ' + LADDER_DAYS + ' days), '
    + num(LADDER_TARGET * COINS_PER_DP) + ' coins, or ' + money(LADDER_TARGET / 25000 * 24.99)
    + ' in cash. Boosts cut the playing figure.';

  var gems = LADDER.filter(function (r) { return r.kind === 'gems'; }).reduce(function (a, r) { return a + r.n; }, 0);
  var coins = LADDER.filter(function (r) { return r.kind === 'coins'; }).reduce(function (a, r) { return a + r.n; }, 0);
  var players = LADDER.filter(function (r) { return r.kind === 'player'; });

  document.getElementById('payout').innerHTML =
    players.length + '<small> players</small> · ' + gems + '<small> gems</small>';
  document.getElementById('payout-sub').textContent =
    'Plus ' + num(coins) + ' coins and 34 other items across ' + LADDER.length + ' rungs. '
    + 'The ' + gems + ' gems alone are worth ' + money(gems / GEM_RATE) + ' at the best store tier.';

  /* --- how a Dream Point is bought ---
     Ranked by what it costs in real money. The coin route looks worst here and
     is still the right one for Francisco, because his coins are earned rather
     than bought — so it gets its own framing rather than a losing rank. */
  var routes = DP_OFFERS.map(function (o) {
    return { o: o, cad: offerCad(o), per: o.dp / offerCad(o) };
  }).sort(function (a, b) { return b.per - a.per; });

  document.getElementById('routes').innerHTML =
    '<div class="route"><b>Winning a match</b>'
    + '<span>' + DP_PER_WIN + ' DP, ' + perWin + ' with an ad</span>'
    + '<em>free</em></div>'
    + routes.map(function (r) {
        var cur = r.o.currency === 'cad' ? 'cash' : r.o.currency;
        var best = r === routes[0] ? ' route--best' : '';
        var free = r.o.currency === 'coins' ? ' route--free' : '';
        return '<div class="route' + best + free + '">'
          + '<b>' + num(r.o.dp) + ' DP for ' + (r.o.currency === 'cad' ? money(r.o.cost) : num(r.o.cost) + ' ' + cur) + '</b>'
          + '<span>' + money(r.cad) + ' of value</span>'
          + '<em>' + num(r.per) + ' DP / C$1</em></div>';
      }).join('');

  /* --- planner --- */
  function plan() {
    var have = Math.max(0, parseInt(document.getElementById('have-dp').value, 10) || 0);
    var spend = Math.max(0, parseInt(document.getElementById('spend-coins').value, 10) || 0);
    var wins = Math.max(0, parseInt(document.getElementById('wins').value, 10) || 0);

    var fromCoins = Math.floor(spend / COINS_PER_DP);
    var short = LADDER_TARGET - have - fromCoins;
    var out = document.getElementById('plan-out');

    if (short <= 0) {
      out.innerHTML = 'You are already there: ' + num(have) + ' DP plus ' + num(fromCoins)
        + ' DP from ' + num(spend) + ' coins clears ' + num(LADDER_TARGET) + '. <em class="ok">No matches needed.</em>';
      return;
    }
    if (wins === 0) {
      out.innerHTML = 'Still short <b>' + num(short) + ' DP</b> after ' + num(fromCoins)
        + ' DP from coins, and you are not planning to play. That gap costs '
        + money(short / 25000 * 24.99) + ' in cash.';
      return;
    }

    var days = short / (wins * perWin);
    var made = days <= LADDER_DAYS;
    out.innerHTML =
      num(spend) + ' coins turn into <b>' + num(fromCoins) + ' DP</b>, leaving <b>' + num(short)
      + ' DP</b> to play for. At ' + wins + ' wins a day with an ad that is <b>'
      + Math.ceil(days) + ' days</b> — <em class="' + (made ? 'ok' : 'no') + '">'
      + (made ? 'inside the ' + LADDER_DAYS + '-day window' : 'past the ' + LADDER_DAYS + '-day window')
      + '</em>.<br>'
      + (made
          ? 'You could drop to ' + Math.ceil(short / (LADDER_DAYS * perWin)) + ' wins a day and still finish.'
          : 'You would need ' + Math.ceil(short / (LADDER_DAYS * perWin)) + ' wins a day, or '
            + money((short - LADDER_DAYS * wins * perWin) / 25000 * 24.99) + ' of Dream Points to cover the rest.')
      + ' Boosts are not counted, so this is the pessimistic case.';
  }
  ['have-dp', 'spend-coins', 'wins'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', plan);
  });
  plan();

  /* --- the ladder itself --- */
  document.getElementById('rows').innerHTML = LADDER.map(function (r) {
    var cls = r.kind === 'player' ? 'is-player'
            : r.kind === 'gems' ? 'is-gems'
            : r.kind === 'dpboost' ? 'is-dpboost' : '';
    return '<tr class="' + cls + '">'
      + '<td>' + (r.dp == null
          ? '<span class="dp dp--none">already claimed</span>'
          : '<span class="dp">' + num(r.dp) + '</span>') + '</td>'
      + '<td><span class="rw">' + r.reward + '</span></td>'
      + '<td><span class="pct">' + (r.dp == null ? '—' : (r.dp / LADDER_TARGET * 100).toFixed(0) + '%') + '</span></td>'
      + '</tr>';
  }).join('');

  /* --- notes --- */
  document.getElementById('how').innerHTML = LADDER_NOTES.map(function (n) {
    return '<li>' + n.text + '<em>' + n.src + '</em></li>';
  }).join('');

  document.getElementById('gaps').innerHTML = [
    'Three early rungs are already claimed in the screenshots, so their rewards are known but '
      + '<b>their point thresholds are not</b>. They are listed without a number rather than guessed.',
    'Francisco put the first player rung at 67,500; the ladder shows <b>62,500</b>. The screenshot wins '
      + 'here, but it is worth a glance.',
    'The screenshots show <b>3 hours left</b> on the ladder while the event is described as running '
      + '90 days. Either the ladder repeats or the 90 days covers something wider — unresolved.',
    '<b>Boosts are not modelled.</b> Dream Time and the +50% / +75% / +150% boost items multiply what '
      + 'a win pays, so every "days to finish" figure here is the slow case.',
    'Whether ad rewards are capped per day is not known. If they are, ' + perWin
      + ' DP a win is optimistic for anyone playing a lot.'
  ].map(function (l) { return '<li>' + l + '</li>'; }).join('');

  document.getElementById('foot').innerHTML =
    'Dream Points cost real money three ways, and they are not close: cash direct is <b>'
    + num(routes[0].per) + ' DP per C$1</b> against ' + num(routes[routes.length - 1].per)
    + ' through coins. That ranking only matters if you are buying the currency first — coins you '
    + 'already earned are free Dream Points, which is why spending a surplus on them is right even '
    + 'though the route sits last on that list.';
})();
</script>
</body>
</html>
