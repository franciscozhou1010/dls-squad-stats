<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store · DLS</title>
<meta name="theme-color" content="#04080f">

<link rel="stylesheet" href="assets/shell.css">
<style>
:root { color-scheme: dark; }

/* --- Headline rates ------------------------------------------------------ */

.rates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 26px; }
.rate-card { padding: 18px 20px; }
.rate-card__lab {
  font-family: var(--dls-mono);
  font-size: 9.5px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.rate-card__big {
  margin-top: 8px;
  font-size: 38px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}
.rate-card__big small { font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--dls-ink-dim); }
.rate-card__sub { margin-top: 9px; font-size: 12px; color: var(--dls-ink-dim); }
.rate-card--gem { --accent: var(--dls-cyan); }
.rate-card--gem .rate-card__big { color: var(--dls-cyan); text-shadow: 0 0 22px rgba(34, 211, 238, .4); }
.rate-card--coin { --accent: var(--dls-amber); }
.rate-card--coin .rate-card__big { color: var(--dls-amber); text-shadow: 0 0 22px rgba(251, 191, 36, .35); }
.rate-card { background: color-mix(in srgb, var(--accent) 46%, var(--dls-edge-soft)); }

/* --- Sections ------------------------------------------------------------ */

.sec { margin-bottom: 28px; }
.sec__head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}
.sec__head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2.4px;
  text-transform: uppercase;
  color: #eef6ff;
}
.sec__head span {
  font-family: var(--dls-mono);
  font-size: 10px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}

.tbl-scroll { overflow-x: auto; }
table { width: 100%; min-width: 660px; border-collapse: collapse; }
th {
  padding: 9px 12px;
  border-bottom: 1px solid var(--dls-edge);
  font-family: var(--dls-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
  text-align: right;
  white-space: nowrap;
}
th:first-child, td:first-child { text-align: left; }
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--dls-edge-soft);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
tbody tr:hover td { background: rgba(34, 211, 238, .04); }

.pack { font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #eef6ff; }
.get { color: var(--dls-ink-dim); }
.get b { color: var(--dls-ink); font-weight: 700; }
.get i { font-style: normal; color: var(--dls-mint); font-size: 11.5px; }
.rate { font-weight: 900; font-size: 15px; }
.sec--gem .rate { color: var(--dls-cyan); }
.sec--coin .rate { color: var(--dls-amber); }
.unit { color: var(--dls-ink-dim); }

.bar-cell { width: 30%; min-width: 130px; }
.bar { height: 7px; background: rgba(255, 255, 255, .06); }
.bar i { display: block; height: 100%; }
.sec--gem .bar i { background: linear-gradient(90deg, rgba(34, 211, 238, .35), var(--dls-cyan)); }
.sec--coin .bar i { background: linear-gradient(90deg, rgba(251, 191, 36, .35), var(--dls-amber)); }

.tag {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 7px;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
  font-family: var(--dls-mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.tag--best { background: rgba(52, 211, 153, .16); color: var(--dls-mint); }
.tag--trap { background: rgba(244, 114, 182, .16); color: var(--dls-magenta); }

tr.is-trap td { background: rgba(244, 114, 182, .045); }

/* --- "How many do I need" solver ----------------------------------------- */

.solve { margin-top: 14px; padding: 16px 18px; }
.solve__lab {
  font-family: var(--dls-mono);
  font-size: 9.5px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--dls-ink-faint);
}
.solve__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.solve input {
  width: 130px;
  padding: 9px 12px;
  clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  border: none;
  background: var(--dls-panel-lit);
  box-shadow: inset 0 0 0 1px var(--dls-edge);
  color: var(--dls-ink);
  font-family: var(--dls-mono);
  font-size: 15px;
  font-weight: 700;
}
.solve input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--dls-cyan); }
.solve__unit { font-family: var(--dls-mono); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dls-ink-faint); }
.solve__out { margin-top: 12px; font-size: 13.5px; line-height: 1.6; color: var(--dls-ink-dim); }
.solve__out b { color: #eef6ff; font-weight: 800; }
.solve__out em { font-style: normal; color: var(--dls-mint); font-weight: 700; }
.solve__up { display: inline-block; margin-top: 6px; color: var(--dls-ink-faint); }
.solve__up b, .solve__up em { color: var(--dls-cyan); }

@media (max-width: 860px) {
  .rates { grid-template-columns: 1fr; }
}
</style>
</head>

<body data-dls-page="store" data-dls-skin="hud">

<div class="wrap">

  <header class="head">
    <p class="eyebrow">// Store</p>
    <h1>Gems <em>&amp;</em> Coins</h1>
    <p class="rule" id="head-rule">—</p>
  </header>

  <div class="rates">
    <div class="dls-panel rate-card rate-card--gem">
      <div class="rate-card__lab">Best gem rate</div>
      <div class="rate-card__big" id="best-gem">—<small> gems / C$1</small></div>
      <div class="rate-card__sub" id="best-gem-sub"></div>
    </div>
    <div class="dls-panel rate-card rate-card--coin">
      <div class="rate-card__lab">Best coin rate</div>
      <div class="rate-card__big" id="best-coin">—<small> coins / C$1</small></div>
      <div class="rate-card__sub" id="best-coin-sub"></div>
    </div>
  </div>

  <section class="sec sec--gem">
    <div class="sec__head"><h2>Gems</h2><span>5 tiers</span></div>
    <div class="dls-panel">
      <div class="tbl-scroll">
        <table>
          <thead><tr>
            <th>Pack</th><th>You get</th><th>Price</th>
            <th>Gems / C$1</th><th>C$ per 100</th><th class="bar-cell">Value</th>
          </tr></thead>
          <tbody id="gem-rows"></tbody>
        </table>
      </div>
    </div>
    <div class="dls-panel solve">
      <div class="solve__lab">Need a specific amount?</div>
      <div class="solve__row">
        <span class="solve__unit">I need</span>
        <input id="gem-need" type="number" min="1" max="20000" step="10" value="280" inputmode="numeric">
        <span class="solve__unit">gems · I have</span>
        <input id="gem-have" type="number" min="0" step="10" value="90" inputmode="numeric">
      </div>
      <div class="solve__out" id="gem-solve"></div>
    </div>
  </section>

  <section class="sec sec--coin">
    <div class="sec__head"><h2>Coins</h2><span>6 tiers</span></div>
    <div class="dls-panel">
      <div class="tbl-scroll">
        <table>
          <thead><tr>
            <th>Pack</th><th>You get</th><th>Price</th>
            <th>Coins / C$1</th><th>C$ per 1,000</th><th class="bar-cell">Value</th>
          </tr></thead>
          <tbody id="coin-rows"></tbody>
        </table>
      </div>
    </div>
    <div class="dls-panel solve">
      <div class="solve__lab">Need a specific amount?</div>
      <div class="solve__row">
        <span class="solve__unit">I need</span>
        <input id="coin-need" type="number" min="1" max="200000" step="100" value="10000" inputmode="numeric">
        <span class="solve__unit">coins · I have</span>
        <input id="coin-have" type="number" min="0" step="100" value="108687" inputmode="numeric">
      </div>
      <div class="solve__out" id="coin-solve"></div>
    </div>
  </section>

  <p class="note" id="foot"></p>

</div>

<script src="data/store.js"></script>
<script src="assets/shell.js" defer></script>
<script>
/* Everything on this page is derived from data/store.js — no rate, ranking or
   verdict is typed by hand, so re-pricing means editing that one file. */

var money = function (n) { return 'C$' + n.toFixed(2); };
var num = function (n) { return n.toLocaleString('en-CA'); };

/* A tier is a trap when a *cheaper* tier gives a better rate: paying more and
   getting less per dollar is the one thing a price ladder should never do,
   and this store does it three times. */
function annotate(packs, amountOf) {
  var rows = packs.map(function (p) {
    return { pack: p, amount: amountOf(p), rate: amountOf(p) / p.price };
  });
  var best = Math.max.apply(null, rows.map(function (r) { return r.rate; }));
  rows.forEach(function (r, i) {
    r.isBest = r.rate === best;
    r.isTrap = rows.some(function (o, j) { return j < i && o.pack.price < r.pack.price && o.rate > r.rate; });
  });
  return { rows: rows, best: best, bestRow: rows.find(function (r) { return r.isBest; }) };
}

function renderRows(tbody, model, getCell, per) {
  document.getElementById(tbody).innerHTML = model.rows.map(function (r) {
    var tag = r.isBest ? '<span class="tag tag--best">Best</span>'
            : r.isTrap ? '<span class="tag tag--trap">Trap</span>' : '';
    return '<tr' + (r.isTrap ? ' class="is-trap"' : '') + '>'
      + '<td><span class="pack">' + r.pack.name + '</span>' + tag + '</td>'
      + '<td class="get">' + getCell(r) + '</td>'
      + '<td>' + money(r.pack.price) + '</td>'
      + '<td class="rate">' + r.rate.toFixed(1) + '</td>'
      + '<td class="unit">' + money(r.pack.price / r.amount * per) + '</td>'
      + '<td class="bar-cell"><div class="bar"><i style="width:' + (r.rate / model.best * 100).toFixed(1) + '%"></i></div></td>'
      + '</tr>';
  }).join('');
}

/* Cheapest way to reach a target: unbounded knapsack minimising spend, so it
   finds "two Stacks beat one Locker" combinations a single-pack lookup misses.
   Exact rather than greedy — greedy gets this wrong precisely at the traps. */
function cheapest(packs, amountOf, target) {
  var cost = new Float64Array(target + 1).fill(Infinity);
  var pick = new Int16Array(target + 1).fill(-1);
  cost[0] = 0;
  for (var t = 1; t <= target; t++) {
    for (var i = 0; i < packs.length; i++) {
      var prev = Math.max(0, t - amountOf(packs[i]));
      var c = cost[prev] + packs[i].price;
      if (c < cost[t]) { cost[t] = c; pick[t] = i; }
    }
  }
  var counts = {}, got = 0, t2 = target;
  while (t2 > 0 && pick[t2] >= 0) {
    var i2 = pick[t2];
    counts[i2] = (counts[i2] || 0) + 1;
    got += amountOf(packs[i2]);
    t2 = Math.max(0, t2 - amountOf(packs[i2]));
  }
  return { cost: cost[target], counts: counts, got: got };
}

/* Minimising cash can land you in the worst tier — covering a 190-gem gap with
   three Bundles is the cheapest cheque and the poorest rate on the board. So
   alongside the cheapest answer, look for a single pack that covers the gap at
   a materially better rate without costing much more, and offer it. */
function betterRate(packs, amountOf, short, minCost, minGot) {
  var minRate = minGot / minCost, best = null;
  packs.forEach(function (p) {
    if (amountOf(p) < short || p.price > minCost * 1.4) return;
    var rate = amountOf(p) / p.price;
    if (rate > minRate * 1.05 && (!best || rate > amountOf(best) / best.price)) best = p;
  });
  return best;
}

function renderSolve(outId, packs, amountOf, target, have, unit, single) {
  var out = document.getElementById(outId);
  var short = target - have;
  if (!(target > 0)) { out.innerHTML = ''; return; }
  if (short <= 0) {
    out.innerHTML = 'You already hold ' + num(have) + ' ' + unit
      + ' — <em>nothing to buy</em>.';
    return;
  }
  target = short;

  var r = cheapest(packs, amountOf, target);
  var parts = Object.keys(r.counts).map(function (i) {
    return '<b>' + r.counts[i] + ' × ' + packs[i].name + '</b>';
  });
  var over = r.got - target;

  out.innerHTML = 'Short ' + num(target) + ' ' + unit + ' — cheapest top-up: '
    + parts.join(' + ') + ' — <em>' + money(r.cost) + '</em>'
    + ' for ' + num(r.got) + ' ' + unit
    + (over > 0 ? ' (' + num(over) + ' spare)' : '')
    + ' at ' + (r.got / r.cost).toFixed(1) + ' ' + unit + ' per C$1'
    + ' (' + money(r.cost / r.got * single) + ' per ' + num(single) + ').';

  var up = betterRate(packs, amountOf, target, r.cost, r.got);
  if (up) {
    out.innerHTML += '<br><span class="solve__up">' + money(up.price - r.cost) + ' more'
      + ' buys <b>1 × ' + up.name + '</b> — ' + num(amountOf(up)) + ' ' + unit
      + ' at <em>' + (amountOf(up) / up.price).toFixed(1) + '</em> per C$1'
      + ', ' + num(amountOf(up) - r.got) + ' more ' + unit + ' for the better rate.</span>';
  }
}

(function () {
  var gemAmt = function (p) { return p.gems; };
  var coinAmt = function (p) { return p.base + p.bonus; };

  var gems = annotate(GEM_PACKS, gemAmt);
  var coins = annotate(COIN_PACKS, coinAmt);

  document.getElementById('head-rule').textContent =
    'Prices in ' + STORE_CURRENCY + ' · read off the store ' + STORE_CHECKED;

  document.getElementById('best-gem').innerHTML =
    gems.best.toFixed(1) + '<small> gems / C$1</small>';
  document.getElementById('best-gem-sub').textContent =
    gems.bestRow.pack.name + ' — ' + money(gems.bestRow.pack.price)
    + ' for ' + num(gems.bestRow.amount) + ', ' + money(100 / gems.best) + ' per 100 gems';

  document.getElementById('best-coin').innerHTML =
    coins.best.toFixed(1) + '<small> coins / C$1</small>';
  document.getElementById('best-coin-sub').textContent =
    coins.bestRow.pack.name + ' — ' + money(coins.bestRow.pack.price)
    + ' for ' + num(coins.bestRow.amount) + ', ' + money(1000 / coins.best) + ' per 1,000 coins';

  renderRows('gem-rows', gems, function (r) {
    return '<b>' + num(r.amount) + '</b> gems';
  }, 100);

  renderRows('coin-rows', coins, function (r) {
    return '<b>' + num(r.pack.base) + '</b> coins'
      + (r.pack.bonus ? ' <i>+' + num(r.pack.bonus) + ' free</i>' : '');
  }, 1000);

  function updateGem() {
    renderSolve('gem-solve', GEM_PACKS, gemAmt,
      Math.min(20000, parseInt(document.getElementById('gem-need').value, 10) || 0),
      Math.max(0, parseInt(document.getElementById('gem-have').value, 10) || 0), 'gems', 100);
  }
  function updateCoin() {
    renderSolve('coin-solve', COIN_PACKS, coinAmt,
      Math.min(200000, parseInt(document.getElementById('coin-need').value, 10) || 0),
      Math.max(0, parseInt(document.getElementById('coin-have').value, 10) || 0), 'coins', 1000);
  }
  document.getElementById('gem-have').addEventListener('input', updateGem);
  document.getElementById('gem-need').addEventListener('input', updateGem);
  document.getElementById('coin-have').addEventListener('input', updateCoin);
  document.getElementById('coin-need').addEventListener('input', updateCoin);
  updateGem();
  updateCoin();

  document.getElementById('foot').innerHTML =
    'Gem and coin tiers are the only store items facility upgrades do not discount, '
    + 'so these rates are not account-specific — but the game reprices, so re-check them. '
    + 'At the best rate on each side, <b>1 gem costs about ' + (coins.best / gems.best).toFixed(1)
    + ' coins</b> of real money. Coaches, scouts, agents, packs and the season pass are not on this page yet.';
})();
</script>
</body>
</html>
